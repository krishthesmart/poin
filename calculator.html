<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
        }

        .calculator {
            width: 375px;
            background: #000;
            padding: 0 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        /* Display */
        .display {
            padding: 20px 12px 8px;
            text-align: right;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .expression {
            font-size: 1.1rem;
            color: #888;
            min-height: 1.4em;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .current {
            font-size: 5rem;
            color: #fff;
            font-weight: 200;
            line-height: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: font-size 0.1s ease;
        }

        .current.shrink {
            font-size: 3.2rem;
        }

        /* Button grid */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .btn {
            border: none;
            border-radius: 50%;
            font-size: 1.75rem;
            font-family: inherit;
            font-weight: 400;
            width: 100%;
            aspect-ratio: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: filter 0.08s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .btn:active {
            filter: brightness(1.5);
        }

        /* Utility: AC, +/-, % */
        .btn-utility {
            background: #a5a5a5;
            color: #000;
        }

        /* Operators: ÷ × − + = */
        .btn-operator {
            background: #ff9f0a;
            color: #fff;
        }

        .btn-operator.active {
            background: #fff;
            color: #ff9f0a;
        }

        /* Numbers */
        .btn-number {
            background: #333;
            color: #fff;
        }

        /* Zero button spans 2 cols */
        .btn-zero {
            grid-column: span 2;
            border-radius: 50px;
            aspect-ratio: unset;
            justify-content: flex-start;
            padding-left: 28px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="current" id="current">0</div>
        </div>
        <div class="buttons">
            <!-- Row 1 -->
            <button class="btn btn-utility" id="btn-ac"  onclick="clearAll()">AC</button>
            <button class="btn btn-utility"              onclick="toggleSign()">+/−</button>
            <button class="btn btn-utility"              onclick="percentage()">%</button>
            <button class="btn btn-operator" id="op-/"  onclick="setOperator('/')">÷</button>

            <!-- Row 2 -->
            <button class="btn btn-number" onclick="inputDigit('7')">7</button>
            <button class="btn btn-number" onclick="inputDigit('8')">8</button>
            <button class="btn btn-number" onclick="inputDigit('9')">9</button>
            <button class="btn btn-operator" id="op-*"  onclick="setOperator('*')">×</button>

            <!-- Row 3 -->
            <button class="btn btn-number" onclick="inputDigit('4')">4</button>
            <button class="btn btn-number" onclick="inputDigit('5')">5</button>
            <button class="btn btn-number" onclick="inputDigit('6')">6</button>
            <button class="btn btn-operator" id="op--"  onclick="setOperator('-')">−</button>

            <!-- Row 4 -->
            <button class="btn btn-number" onclick="inputDigit('1')">1</button>
            <button class="btn btn-number" onclick="inputDigit('2')">2</button>
            <button class="btn btn-number" onclick="inputDigit('3')">3</button>
            <button class="btn btn-operator" id="op-+"  onclick="setOperator('+')">+</button>

            <!-- Row 5 -->
            <button class="btn btn-number btn-zero" onclick="inputDigit('0')">0</button>
            <button class="btn btn-number"          onclick="inputDecimal()">.</button>
            <button class="btn btn-operator"        onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let currentValue = '0';
        let previousValue = '';
        let operator = null;
        let waitingForOperand = false;
        let justCalculated = false;

        const currentDisplay = document.getElementById('current');
        const expressionDisplay = document.getElementById('expression');
        const acBtn = document.getElementById('btn-ac');

        function updateDisplay() {
            let display = currentValue;
            if (display !== 'Error' && display.replace('-', '').replace('.', '').length > 9) {
                const num = parseFloat(currentValue);
                display = parseFloat(num.toPrecision(9)).toString();
            }
            currentDisplay.textContent = display;
            currentDisplay.classList.toggle('shrink', display.length > 9);
            acBtn.textContent = (currentValue === '0' && !previousValue) ? 'AC' : 'C';
        }

        function clearAll() {
            currentValue = '0';
            previousValue = '';
            operator = null;
            waitingForOperand = false;
            justCalculated = false;
            expressionDisplay.textContent = '';
            document.querySelectorAll('.btn-operator').forEach(b => b.classList.remove('active'));
            updateDisplay();
        }

        function inputDigit(digit) {
            if (justCalculated) {
                currentValue = digit;
                expressionDisplay.textContent = '';
                justCalculated = false;
            } else if (waitingForOperand) {
                currentValue = digit;
                waitingForOperand = false;
            } else {
                currentValue = currentValue === '0' ? digit : currentValue + digit;
            }
            document.querySelectorAll('.btn-operator').forEach(b => b.classList.remove('active'));
            updateDisplay();
        }

        function inputDecimal() {
            if (justCalculated) {
                currentValue = '0.';
                justCalculated = false;
                expressionDisplay.textContent = '';
            } else if (waitingForOperand) {
                currentValue = '0.';
                waitingForOperand = false;
            } else if (!currentValue.includes('.')) {
                currentValue += '.';
            }
            document.querySelectorAll('.btn-operator').forEach(b => b.classList.remove('active'));
            updateDisplay();
        }

        function toggleSign() {
            if (currentValue !== '0' && currentValue !== 'Error') {
                currentValue = currentValue.startsWith('-')
                    ? currentValue.slice(1)
                    : '-' + currentValue;
                updateDisplay();
            }
        }

        function percentage() {
            if (currentValue === 'Error') return;
            currentValue = String(parseFloat(currentValue) / 100);
            updateDisplay();
        }

        function setOperator(op) {
            if (currentValue === 'Error') return;
            if (operator && !waitingForOperand) {
                calculate(true);
            }

            previousValue = currentValue;
            operator = op;
            waitingForOperand = true;
            justCalculated = false;

            const opSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
            expressionDisplay.textContent = `${previousValue} ${opSymbols[op]}`;

            document.querySelectorAll('.btn-operator').forEach(b => b.classList.remove('active'));
            document.getElementById(`op-${op}`)?.classList.add('active');
            updateDisplay();
        }

        function calculate(chained = false) {
            if (!operator || previousValue === '') return;

            const prev = parseFloat(previousValue);
            const curr = parseFloat(currentValue);
            const opSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
            let result;

            switch (operator) {
                case '+': result = prev + curr; break;
                case '-': result = prev - curr; break;
                case '*': result = prev * curr; break;
                case '/':
                    if (curr === 0) {
                        currentValue = 'Error';
                        expressionDisplay.textContent = '';
                        operator = null;
                        waitingForOperand = false;
                        justCalculated = true;
                        document.querySelectorAll('.btn-operator').forEach(b => b.classList.remove('active'));
                        updateDisplay();
                        return;
                    }
                    result = prev / curr;
                    break;
            }

            result = parseFloat(result.toPrecision(12));

            if (!chained) {
                expressionDisplay.textContent = `${previousValue} ${opSymbols[operator]} ${currentValue} =`;
            }

            currentValue = String(result);
            operator = chained ? operator : null;
            waitingForOperand = false;
            justCalculated = !chained;

            document.querySelectorAll('.btn-operator').forEach(b => b.classList.remove('active'));
            updateDisplay();
        }

        // Keyboard support
        document.addEventListener('keydown', e => {
            if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
            else if (e.key === '.') inputDecimal();
            else if (e.key === '+') setOperator('+');
            else if (e.key === '-') setOperator('-');
            else if (e.key === '*') setOperator('*');
            else if (e.key === '/') { e.preventDefault(); setOperator('/'); }
            else if (e.key === 'Enter' || e.key === '=') calculate();
            else if (e.key === 'Escape') clearAll();
            else if (e.key === 'Backspace') {
                if (currentValue.length > 1 && currentValue !== 'Error') {
                    currentValue = currentValue.slice(0, -1) || '0';
                } else {
                    currentValue = '0';
                }
                updateDisplay();
            }
        });
    </script>
</body>
</html>
