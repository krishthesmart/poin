<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            background-color: #1e2a47;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(30, 42, 71, 0.4);
            width: 320px;
        }

        .display {
            background-color: #111c33;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 20px;
            text-align: right;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .display .expression {
            font-size: 0.9rem;
            color: #8899bb;
            min-height: 1.2em;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .display .current {
            font-size: 2.4rem;
            color: #ffffff;
            font-weight: 300;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            padding: 18px 0;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.1s ease;
            user-select: none;
        }

        button:active {
            transform: scale(0.94);
            filter: brightness(0.85);
        }

        .btn-number {
            background-color: #2d3f66;
            color: #ffffff;
        }

        .btn-number:hover {
            background-color: #3a5080;
        }

        .btn-operator {
            background-color: #3a6ea5;
            color: #ffffff;
        }

        .btn-operator:hover {
            background-color: #4a80bb;
        }

        .btn-operator.active {
            background-color: #ffffff;
            color: #3a6ea5;
        }

        .btn-equals {
            background-color: #3a6ea5;
            color: #ffffff;
            grid-row: span 2;
            font-size: 1.6rem;
        }

        .btn-equals:hover {
            background-color: #4a80bb;
        }

        .btn-clear {
            background-color: #c0392b;
            color: #ffffff;
        }

        .btn-clear:hover {
            background-color: #e04030;
        }

        .btn-utility {
            background-color: #3d4f70;
            color: #ccddff;
            font-size: 1rem;
        }

        .btn-utility:hover {
            background-color: #4e6090;
        }

        .btn-zero {
            grid-column: span 2;
            text-align: left;
            padding-left: 22px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="current" id="current">0</div>
        </div>
        <div class="buttons">
            <!-- Row 1 -->
            <button class="btn-clear" onclick="clearAll()">AC</button>
            <button class="btn-utility" onclick="toggleSign()">+/−</button>
            <button class="btn-utility" onclick="percentage()">%</button>
            <button class="btn-operator" id="op-/" onclick="setOperator('/')">÷</button>

            <!-- Row 2 -->
            <button class="btn-number" onclick="inputDigit('7')">7</button>
            <button class="btn-number" onclick="inputDigit('8')">8</button>
            <button class="btn-number" onclick="inputDigit('9')">9</button>
            <button class="btn-operator" id="op-*" onclick="setOperator('*')">×</button>

            <!-- Row 3 -->
            <button class="btn-number" onclick="inputDigit('4')">4</button>
            <button class="btn-number" onclick="inputDigit('5')">5</button>
            <button class="btn-number" onclick="inputDigit('6')">6</button>
            <button class="btn-operator" id="op--" onclick="setOperator('-')">−</button>

            <!-- Row 4 -->
            <button class="btn-number" onclick="inputDigit('1')">1</button>
            <button class="btn-number" onclick="inputDigit('2')">2</button>
            <button class="btn-number" onclick="inputDigit('3')">3</button>
            <button class="btn-operator" id="op-+" onclick="setOperator('+')">+</button>

            <!-- Row 5 -->
            <button class="btn-number btn-zero" onclick="inputDigit('0')">0</button>
            <button class="btn-number" onclick="inputDecimal()">.</button>
            <button class="btn-equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let currentValue = '0';
        let previousValue = '';
        let operator = null;
        let waitingForOperand = false;
        let justCalculated = false;

        const currentDisplay = document.getElementById('current');
        const expressionDisplay = document.getElementById('expression');

        function updateDisplay() {
            let display = currentValue;
            if (display.length > 12) {
                display = parseFloat(currentValue).toPrecision(8);
            }
            currentDisplay.textContent = display;
        }

        function clearAll() {
            currentValue = '0';
            previousValue = '';
            operator = null;
            waitingForOperand = false;
            justCalculated = false;
            expressionDisplay.textContent = '';
            document.querySelectorAll('.btn-operator').forEach(b => b.classList.remove('active'));
            updateDisplay();
        }

        function inputDigit(digit) {
            if (justCalculated) {
                currentValue = digit;
                expressionDisplay.textContent = '';
                justCalculated = false;
            } else if (waitingForOperand) {
                currentValue = digit;
                waitingForOperand = false;
            } else {
                currentValue = currentValue === '0' ? digit : currentValue + digit;
            }
            updateDisplay();
        }

        function inputDecimal() {
            if (justCalculated) {
                currentValue = '0.';
                justCalculated = false;
                expressionDisplay.textContent = '';
            } else if (waitingForOperand) {
                currentValue = '0.';
                waitingForOperand = false;
            } else if (!currentValue.includes('.')) {
                currentValue += '.';
            }
            updateDisplay();
        }

        function toggleSign() {
            if (currentValue !== '0') {
                currentValue = currentValue.startsWith('-')
                    ? currentValue.slice(1)
                    : '-' + currentValue;
                updateDisplay();
            }
        }

        function percentage() {
            currentValue = String(parseFloat(currentValue) / 100);
            updateDisplay();
        }

        function setOperator(op) {
            if (operator && !waitingForOperand) {
                calculate(true);
            }

            previousValue = currentValue;
            operator = op;
            waitingForOperand = true;
            justCalculated = false;

            const opSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
            expressionDisplay.textContent = `${previousValue} ${opSymbols[op]}`;

            document.querySelectorAll('.btn-operator').forEach(b => b.classList.remove('active'));
            document.getElementById(`op-${op}`)?.classList.add('active');
        }

        function calculate(chained = false) {
            if (!operator || (!waitingForOperand && previousValue === '')) return;

            const prev = parseFloat(previousValue);
            const curr = parseFloat(currentValue);
            const opSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
            let result;

            switch (operator) {
                case '+': result = prev + curr; break;
                case '-': result = prev - curr; break;
                case '*': result = prev * curr; break;
                case '/':
                    if (curr === 0) {
                        currentValue = 'Error';
                        expressionDisplay.textContent = '';
                        operator = null;
                        waitingForOperand = false;
                        justCalculated = true;
                        updateDisplay();
                        document.querySelectorAll('.btn-operator').forEach(b => b.classList.remove('active'));
                        return;
                    }
                    result = prev / curr;
                    break;
            }

            // Avoid floating point display issues
            result = parseFloat(result.toPrecision(12));

            if (!chained) {
                expressionDisplay.textContent = `${previousValue} ${opSymbols[operator]} ${currentValue} =`;
            }

            currentValue = String(result);
            operator = chained ? operator : null;
            waitingForOperand = false;
            justCalculated = !chained;

            document.querySelectorAll('.btn-operator').forEach(b => b.classList.remove('active'));
            updateDisplay();
        }

        // Keyboard support
        document.addEventListener('keydown', e => {
            if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
            else if (e.key === '.') inputDecimal();
            else if (e.key === '+') setOperator('+');
            else if (e.key === '-') setOperator('-');
            else if (e.key === '*') setOperator('*');
            else if (e.key === '/') { e.preventDefault(); setOperator('/'); }
            else if (e.key === 'Enter' || e.key === '=') calculate();
            else if (e.key === 'Escape') clearAll();
            else if (e.key === 'Backspace') {
                if (currentValue.length > 1) {
                    currentValue = currentValue.slice(0, -1);
                } else {
                    currentValue = '0';
                }
                updateDisplay();
            }
        });
    </script>
</body>
</html>
